name: Gemini handbook PDF, QA and Pages
on:
  push:
    branches: [main]
    paths:
      - 'gemini-handbook/data.js'
      - 'gemini-handbook/index.html'
      - 'gemini-handbook/site.js'
      - 'gemini-handbook/style.css'
      - 'gemini-handbook/print.html'
      - 'gemini-handbook/print.js'
      - 'gemini-handbook/scripts/**'
      - 'gemini-handbook/README.md'
      - '.github/workflows/build-gemini-handbook.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: gemini-handbook-release
  cancel-in-progress: false
jobs:
  live-qa:
    needs: [build, browser-qa]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify real production website and downloadable PDF
        run: python3 gemini-handbook/scripts/check_live.py
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Chromium browser regression runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual mobile and desktop interactions
        run: |
          set -euo pipefail
          python3 -m http.server 8123 --bind 127.0.0.1 >/tmp/gemini-browser-server.log 2>&1 &
          node gemini-handbook/scripts/browser_smoke.mjs
      - name: Preserve tested page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-browser-qa-360-390-1280
          path: gemini-handbook/qa/*.png
          if-no-files-found: ignore
          retention-days: 21
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    outputs:
      pages_mode: ${{ steps.pages-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install embeddable Chinese font and PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-gbsn00lp
          python -m pip install 'reportlab>=4.2,<5' 'PyMuPDF>=1.24,<2'
      - name: Validate JavaScript syntax (no hidden dependencies)
        run: |
          node --check gemini-handbook/data.js
          node --check gemini-handbook/site.js
          node --check gemini-handbook/print.js
      - name: Build complete Chinese PDF from the same course source
        run: python gemini-handbook/scripts/build_pdf.py
      - name: Quality gate (source / content / PDF / links / clipping)
        run: python gemini-handbook/scripts/check_release.py
      - name: Smoke test static HTTP assets
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/gemini-http.log 2>&1 &
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8123/gemini-handbook/ | grep -q 'GEMINI FIELD GUIDE'
          curl --fail --silent --show-error http://127.0.0.1:8123/gemini-handbook/print.html | grep -q 'print-root'
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8123/gemini-handbook/downloads/gemini-practical-handbook.pdf
      - name: Upload audit PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemini-handbook-v1-pdf
          path: gemini-handbook/downloads/gemini-practical-handbook.pdf
          retention-days: 30
      - name: Commit deterministic PDF to current public Pages branch (no force push)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          built_pdf="/tmp/gemini-handbook-built-${GITHUB_RUN_ID}.pdf"
          cp gemini-handbook/downloads/gemini-practical-handbook.pdf "$built_pdf"
          original_source_sha="$(git rev-parse HEAD:gemini-handbook/data.js)"
          done=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            latest_source_sha="$(git rev-parse origin/main:gemini-handbook/data.js)"
            if [[ "$original_source_sha" != "$latest_source_sha" ]]; then
              echo "Source changed during PDF build; skip stale publication"
              exit 0
            fi
            git reset --hard origin/main
            cp "$built_pdf" gemini-handbook/downloads/gemini-practical-handbook.pdf
            git add -f gemini-handbook/downloads/gemini-practical-handbook.pdf
            if git diff --cached --quiet; then
              echo "Source-matched PDF already published"
              done=1
              break
            fi
            git commit -m 'docs(gemini): publish deterministic source-matched PDF [skip ci]'
            if git push origin HEAD:main; then
              done=1
              break
            fi
            echo "Competing commit detected, retrying safe fast-forward publication attempt $attempt"
            sleep 2
          done
          test "$done" = 1
      - name: Detect existing Pages mode without changing configuration
        id: pages-mode
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode="$(gh api repos/${{ github.repository }}/pages --jq '.build_type' 2>/dev/null || echo unknown)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Existing Pages build type: $mode"
      - name: Upload site artifact if Pages uses Actions deployment
        if: steps.pages-mode.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./
  deploy-if-actions:
    needs: build
    if: needs.build.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://aipmandy.github.io/gemini-handbook/
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
