name: Portal directory PDF and quality gate
on:
  pull_request:
    paths:
      - index.html
      - assets/portal-catalog.js
      - scripts/build_portal_pdf.py
      - scripts/check_portal_pdf.py
      - scripts/browser_smoke.mjs
      - .github/workflows/catalog.yml
  push:
    branches: [main]
    paths:
      - index.html
      - assets/portal-catalog.js
      - scripts/build_portal_pdf.py
      - scripts/check_portal_pdf.py
      - scripts/browser_smoke.mjs
      - .github/workflows/catalog.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portal-catalog
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      pages_mode: ${{ steps.pages-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked-major PDF dependencies
        run: python -m pip install 'reportlab>=4.2,<5' 'PyMuPDF>=1.24,<2'
      - name: Validate JavaScript syntax
        run: node --check assets/portal-catalog.js
      - name: Build from existing portal ItemList
        run: python scripts/build_portal_pdf.py
      - name: Check links, full-page raster and machine-extracted text
        run: python scripts/check_portal_pdf.py
      - name: Install Playwright and Chromium for real interaction regression
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser regression on 360/390/1280px viewports
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/portal-server.log 2>&1 &
          node scripts/browser_smoke.mjs
      - name: Upload PDF and every page visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: portal-directory-pdf-and-page-qa
          path: |
            pdf/andy-open-source-catalog.pdf
            pdf/edition.json
            pdf/qa/report.json
            pdf/qa/page-*.png
          retention-days: 30
      - name: Archive source-matched PDF with safe fast-forward retries
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p /tmp/portal-qa-release
          cp pdf/andy-open-source-catalog.pdf pdf/edition.json /tmp/portal-qa-release/
          source_index_sha="$(git rev-parse HEAD:index.html)"
          source_catalog_sha="$(git rev-parse HEAD:assets/portal-catalog.js)"
          done=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            if [[ "$source_index_sha" != "$(git rev-parse origin/main:index.html)" ]] || [[ "$source_catalog_sha" != "$(git rev-parse origin/main:assets/portal-catalog.js)" ]]; then
              echo "Catalog source changed during build; skip stale PDF publication"
              exit 0
            fi
            git reset --hard origin/main
            cp /tmp/portal-qa-release/andy-open-source-catalog.pdf pdf/andy-open-source-catalog.pdf
            cp /tmp/portal-qa-release/edition.json pdf/edition.json
            git add -f pdf/andy-open-source-catalog.pdf pdf/edition.json
            if git diff --cached --quiet; then
              echo "Catalog PDF and edition already match source"
              done=1
              break
            fi
            git commit -m 'docs(pdf): archive source-verified portal navigation PDF [skip ci]'
            if git push origin HEAD:main; then
              done=1
              break
            fi
            echo "Concurrent commit, retrying fast-forward ($attempt)"
            sleep 2
          done
          test "$done" = 1
      - name: Inspect configured Pages source (do not mutate settings)
        id: pages-mode
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mode=unknown
          if json="$(gh api repos/${{ github.repository }}/pages 2>/dev/null)"; then
            mode="$(printf '%s' "$json" | python3 -c 'import sys,json; j=json.load(sys.stdin); print(j.get("build_type", "unknown"))')"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages configured build_type=$mode"
  deploy-if-actions:
    needs: verify
    if: github.event_name != 'pull_request' && needs.verify.outputs.pages_mode == 'workflow'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://aipmandy.github.io/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portal-directory-pdf-and-page-qa
          path: ./_pdf_artifacts
      - name: Assemble Pages artifact without removing existing hosted subprojects
        run: |
          set -euo pipefail
          mkdir -p _site/pdf
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='scripts/' --exclude='_site/' --exclude='_pdf_artifacts/' \
            --exclude='pdf/qa/' ./ _site/
          pdf_path="$(find _pdf_artifacts -name 'andy-open-source-catalog.pdf' -print -quit)"
          edition_path="$(find _pdf_artifacts -name 'edition.json' -print -quit)"
          test -n "$pdf_path" && test -n "$edition_path"
          cp "$pdf_path" _site/pdf/andy-open-source-catalog.pdf
          cp "$edition_path" _site/pdf/edition.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - uses: actions/deploy-pages@v4
      - name: Verify deployed homepage and actual PDF bytes
        run: |
          set -euo pipefail
          expected="$(sha256sum _site/pdf/andy-open-source-catalog.pdf | cut -d' ' -f1)"
          pass=0
          for i in $(seq 1 12); do
            if curl -fsSL --max-time 20 'https://aipmandy.github.io/' -o /tmp/portal-home.html \
               && grep -q 'catalog-search' /tmp/portal-home.html \
               && curl -fsSL --max-time 30 'https://aipmandy.github.io/pdf/andy-open-source-catalog.pdf' -o /tmp/catalog-live.pdf \
               && [ "$(sha256sum /tmp/catalog-live.pdf | cut -d' ' -f1)" = "$expected" ]; then
              pass=1; break
            fi
            sleep 10
          done
          [ "$pass" -eq 1 ] || { echo 'LIVE not verified: do not mark DONE'; exit 1; }
          echo "LIVE VERIFIED root + PDF sha256=$expected"
