name: Portal live Pages and PDF SHA verification
on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/verify_portal_live.py
      - .github/workflows/portal-live.yml
      - pdf/edition.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the archived PDF and edition manifest
        run: |
          test -s pdf/andy-open-source-catalog.pdf
          test -s pdf/edition.json
          python3 -m py_compile scripts/verify_portal_live.py
      - name: Wait for live Pages propagation and verify 6 exact file SHA-256 hashes
        run: python3 scripts/verify_portal_live.py
      - name: Preserve live audit evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portal-live-qa
          path: portal-live-report.json
          retention-days: 30
